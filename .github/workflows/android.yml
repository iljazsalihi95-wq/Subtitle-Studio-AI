name: Android APK
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block tracked private credentials in public build sources
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split(chr(0))
          blocked = []
          for name in tracked:
              if not name:
                  continue
              p = PurePosixPath(name)
              lower = p.name.lower()
              if (lower == '.env' or lower.startswith('.env.')
                  or lower in {'google-services.json', 'googleservice-info.plist', 'key.properties', 'service-account.json', 'credentials.json'}
                  or lower.endswith(('.jks', '.keystore', '.p12', '.pfx', '.pem', '.key'))
                  or lower.startswith(('id_rsa', 'id_ed25519'))):
                  blocked.append(name)
          if blocked:
              raise SystemExit(f'{len(blocked)} potentially private credential file(s) tracked; remove and rotate any exposed secrets before building')
          print('No known private credential file types tracked in source')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name "$(grep '^name:' pubspec.yaml | awk '{print $2}')" .
      - name: Install native video audio extraction bridge
        run: |
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/subtitle_studio_ai/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY
      - name: Use official Gradle distribution CDN
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = p.read_text().replace('services.gradle.org/distributions/', 'downloads.gradle.org/distributions/')
          p.write_text(text)
          PYCODE
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install Android API 36 and set compileSdk
        run: |
          # yes may exit with SIGPIPE after sdkmanager succeeds; check sdkmanager itself.
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          sdk_status=${PIPESTATUS[1]}
          set -e
          test "$sdk_status" -eq 0
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(s)
          PY
      - name: Set application label and preserve existing Android identity
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:label="[^"]*"', 'android:label="Subtitle Studio AI"', text, count=1)
          # Keep imported documents, subtitle projects and app preferences out of
          # Android cloud/device backups by default.
          text = re.sub(r'\sandroid:allowBackup="[^"]*"', '', text, count=1)
          text = text.replace('<application', '<application android:allowBackup="false"', 1)
          assert text.count('android:allowBackup="false"') == 1
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts').read_text()
          assert 'applicationId = "com.example.subtitle_studio_ai"' in gradle, 'Android identity changed unexpectedly'
          PYCODE
      - name: Check Android package identity for update compatibility
        run: |
          grep -n 'applicationId' android/app/build.gradle.kts
          echo '::notice::Existing install updates require matching package ID and signing certificate.'
      - name: Generate original launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
      - name: Install branded round launcher for Samsung One UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              directory = Path('android/app/src/main/res') / f'mipmap-{density}'
              source = directory / 'ic_launcher.png'
              assert source.is_file(), f'Missing branded launcher: {source}'
              shutil.copyfile(source, directory / 'ic_launcher_round.png')
          xml = re.sub(r'\sandroid:roundIcon="[^"]*"', '', xml, count=1)
          xml = xml.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          assert xml.count('android:roundIcon="@mipmap/ic_launcher_round"') == 1
          manifest.write_text(xml)
          print('Samsung round launcher uses original branded artwork in all five densities')
          PY
      - name: Prevent default Flutter adaptive icon overriding branded icon
        run: |
          # Flutter's generated adaptive launcher can take precedence on Android 8+.
          # Use our custom mipmap PNGs consistently, including Samsung One UI.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Verify custom launcher icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              directory = Path(f'android/app/src/main/res/mipmap-{density}')
              path = directory / 'ic_launcher.png'
              round_path = directory / 'ic_launcher_round.png'
              assert path.is_file() and round_path.is_file(), f'Missing branded icons in {directory}'
              with Image.open(path) as icon, Image.open(round_path) as round_icon:
                  assert icon.size == (size, size), f'Invalid icon size: {path}'
                  assert round_icon.size == icon.size, f'Invalid round icon size: {round_path}'
                  rgb = icon.convert('RGB')
                  colors = rgb.getcolors(maxcolors=size * size)
                  assert colors is not None and len(colors) >= 3, f'Blank or placeholder icon: {path}'
                  assert any(r > 130 and g > 90 and b < 180 for _, (r, g, b) in colors), f'Branded gold accent missing: {path}'
                  assert icon.convert('RGBA').tobytes() == round_icon.convert('RGBA').tobytes(), f'Round icon differs from branded icon: {density}'
          print('Five original gold-accented launcher and Samsung round icons verified')
          PY
      - name: Reject generic Android launcher and verify branded artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path('android/app/src/main/res')
          for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
              p = base / f'mipmap-{density}' / 'ic_launcher.png'
              with Image.open(p) as image:
                  rgb = image.convert('RGB')
                  pixels = list(rgb.getdata())
                  assert len(set(pixels)) > 12, f'Generic/blank icon: {p}'
                  gold = sum(1 for r,g,b in pixels if r > 130 and g > 90 and b < 185)
                  assert gold > len(pixels) // 100, f'Branded gold artwork absent: {p}'
          assert not (base / 'mipmap-anydpi-v26/ic_launcher.xml').exists(), 'Default adaptive icon overrides artwork'
          print('Verified branded icon artwork in all five launcher densities')
          PY
      - name: Verify Samsung round icons match branded launcher pixels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          base = Path('android/app/src/main/res')
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              directory = base / f'mipmap-{density}'
              regular = directory / 'ic_launcher.png'
              round_icon = directory / 'ic_launcher_round.png'
              assert regular.is_file() and round_icon.is_file(), f'Missing branded icon at {density}'
              with Image.open(regular) as original, Image.open(round_icon) as rounded:
                  assert original.size == rounded.size, f'Icon dimensions differ at {density}'
                  assert original.convert('RGBA').tobytes() == rounded.convert('RGBA').tobytes(), f'Round launcher does not match original at {density}'
          print('Samsung round and regular launchers match at all five densities')
          PY
      - name: Test authenticated AI proxy
        run: node --test backend/test/worker.test.mjs
      - name: Clean generated Flutter build outputs before dependency resolution
        run: flutter clean
      - run: flutter pub get
      # Flutter stable currently reports framework material imports as deprecation infos.
      # Keep analyzer errors and warnings fatal while allowing informational diagnostics.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build Samsung S23 arm64 APK
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Validate installable APK ZIP structure and ARM64 payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          assert apk.is_file() and apk.stat().st_size > 1_000_000, 'Missing or suspiciously small APK'
          with ZipFile(apk) as archive:
              bad = archive.testzip()
              assert bad is None, f'Corrupt APK entry: {bad}'
              names = set(archive.namelist())
              assert 'AndroidManifest.xml' in names, 'Android manifest missing'
              assert 'classes.dex' in names, 'Android dex bytecode missing'
              assert 'lib/arm64-v8a/libflutter.so' in names, 'ARM64 Flutter runtime missing'
              assert any(n.startswith('assets/flutter_assets/') for n in names), 'Flutter app assets missing'
          print('APK archive integrity, manifest, dex and ARM64 libraries verified')
          PY
      - name: Verify APK launcher pixels, ARM64 runtime and bundled illustrations
        run: python3 scripts/verify_apk_resources.py
      - name: Verify compiled launcher resources
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          # Verify the launcher resource itself, not just unrelated PNG assets.
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump resources "$APK" > /tmp/compiled-apk-resources.txt
          grep -q 'mipmap/ic_launcher' /tmp/compiled-apk-resources.txt
          "$AAPT" dump badging "$APK" > /tmp/compiled-apk-badging.txt
          grep -q "^application-icon-" /tmp/compiled-apk-badging.txt
          grep -q "^package: name=" /tmp/compiled-apk-badging.txt
          # The launcher must resolve to a real Activity and to our branded mipmap.
          grep -q "^launchable-activity:" /tmp/compiled-apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/compiled-apk-badging.txt').read_text()
          icons = re.findall(r"^application-icon-\d+:'([^']+)'", text, re.M)
          assert icons, 'No density-specific launcher icons packaged'
          assert all('ic_launcher.png' in icon and 'mipmap-' in icon for icon in icons), f'Unexpected launcher icons: {icons}'
          print(f'Launchable activity and {len(icons)} branded launcher icon paths verified')
          PY
          # Verify the user-visible app name inside the built APK, not only the source manifest.
          grep -Fq "application-label:'Subtitle Studio AI'" /tmp/compiled-apk-badging.txt
          echo "Compiled APK launcher resource, app label and package metadata verified"
      - name: Compare packaged Samsung launcher pixels with original artwork
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image, ImageChops
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          assert apk.is_file(), 'ARM64 APK missing'
          with ZipFile(apk) as package:
              entries = set(package.namelist())
              for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
                  base = f'res/mipmap-{density}'
                  source = Path('android/app/src/main') / base / 'ic_launcher.png'
                  assert source.is_file(), f'Missing original launcher: {source}'
                  packaged = [p for p in entries if p in (base + '/ic_launcher.png', base + '-v4/ic_launcher.png')]
                  assert len(packaged) == 1, f'Expected one packaged launcher for {density}, found {packaged}'
                  with Image.open(source) as original, Image.open(BytesIO(package.read(packaged[0]))) as built:
                      original_rgba = original.convert('RGBA')
                      built_rgba = built.convert('RGBA')
                      assert original_rgba.size == built_rgba.size, f'{density} launcher size changed'
                      assert original_rgba.tobytes() == built_rgba.tobytes(), f'{density} launcher pixels changed in APK'
          print('All five Samsung launcher densities match original branded artwork pixel-for-pixel')
          PY
      - name: Verify Samsung S23 APK signing and Android compatibility
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > /tmp/s23-badging.txt
          grep -q "^package: name=" /tmp/s23-badging.txt
          grep -Fq "package: name='com.example.subtitle_studio_ai'" /tmp/s23-badging.txt
          grep -Fq "native-code: 'arm64-v8a'" /tmp/s23-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/s23-badging.txt').read_text()
          match = re.search(r"sdkVersion:'(\d+)'", text)
          assert match, 'Missing minSdkVersion in APK'
          minimum = int(match.group(1))
          assert minimum <= 33, f'APK requires Android API {minimum}, higher than Galaxy S23 launch Android 13 (API 33)'
          print(f'APK signed and minSdk={minimum}; supports Galaxy S23 from Android 13 (API 33)')
          PY
      - name: Verify Samsung launcher identity and app label in compiled APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/s23-launcher-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          data = Path('/tmp/s23-launcher-badging.txt').read_text()
          label = re.search(r"^application-label:'([^']*)'", data, re.M)
          assert label and label.group(1) == 'Subtitle Studio AI', 'Samsung app label missing or changed'
          icon = re.search(r"^application-icon-\d+:'([^']+)'", data, re.M)
          assert icon, 'No launcher icon declared in compiled APK'
          assert 'ic_launcher' in icon.group(1), 'Launcher does not use branded icon resource'
          assert not icon.group(1).endswith('.xml'), 'Adaptive launcher XML may override branded PNG'
          print('Samsung launcher label and branded PNG resource verified in compiled APK')
          PY
      - name: Verify installed APK disables Android data backup
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/s23-manifest-tree.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          tree = Path('/tmp/s23-manifest-tree.txt').read_text()
          app = re.search(r'^\s*E: application\b(?P<body>.*?)(?=^\s*E: (?:activity|service|receiver|provider|uses-|queries)\b|\Z)', tree, re.M | re.S)
          assert app, 'Compiled APK application manifest not found'
          backup = re.search(r'android:allowBackup\(0x01010280\)=\(type 0x12\)0x0\b', app.group('body'))
          assert backup, 'APK must explicitly disable Android data backup'
          print('Compiled Samsung S23 APK disables Android data backup')
          PY
      - name: Reject sensitive Android permissions in distributable APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" > /tmp/apk-permissions.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          permissions = Path('/tmp/apk-permissions.txt').read_text()
          blocked = {
              'android.permission.READ_SMS',
              'android.permission.SEND_SMS',
              'android.permission.RECEIVE_SMS',
              'android.permission.READ_CALL_LOG',
              'android.permission.WRITE_CALL_LOG',
              'android.permission.READ_CONTACTS',
              'android.permission.WRITE_CONTACTS',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'android.permission.QUERY_ALL_PACKAGES',
              'android.permission.REQUEST_INSTALL_PACKAGES',
          }
          found = set(re.findall(r"name='([^']+)'", permissions))
          unexpected = sorted(found & blocked)
          assert not unexpected, 'Sensitive Android permissions unexpectedly packaged: ' + ', '.join(unexpected)
          print('APK privacy permission gate passed')
          PY
      - name: Verify original launcher artwork inside compiled Samsung APK
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageChops
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          assert apk.is_file(), 'Compiled APK missing'
          with ZipFile(apk) as archive:
              entries = archive.namelist()
              for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
                  original = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
                  assert original.is_file(), f'Missing original icon: {density}'
                  matches = [name for name in entries
                             if name.startswith(f'res/mipmap-{density}')
                             and name.endswith('/ic_launcher.png')]
                  assert len(matches) == 1, f'Expected one packaged branded launcher for {density}, found {matches}'
                  with Image.open(original) as source, Image.open(BytesIO(archive.read(matches[0]))) as packaged:
                      a, b = source.convert('RGBA'), packaged.convert('RGBA')
                      assert a.size == b.size and a.tobytes() == b.tobytes(), (
                          f'Packaged launcher differs from approved original artwork: {density}')
          print('All five compiled APK launcher PNGs match original branded artwork pixel-for-pixel')
          PY
      - name: Verify packaged Samsung round icons match original artwork
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageChops
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          with ZipFile(apk) as archive:
              entries = archive.namelist()
              for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
                  source = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher_round.png')
                  assert source.is_file(), f'Missing Samsung round source icon: {density}'
                  matches = [name for name in entries if name.startswith(f'res/mipmap-{density}') and name.endswith('/ic_launcher_round.png')]
                  assert len(matches) == 1, f'Expected one packaged Samsung round icon at {density}, found {matches}'
                  with Image.open(source) as original, Image.open(BytesIO(archive.read(matches[0]))) as packaged:
                      a, b = original.convert('RGBA'), packaged.convert('RGBA')
                      assert a.size == b.size and a.tobytes() == b.tobytes(), f'Packaged Samsung round icon changed: {density}'
          print('All five Samsung One UI round icons match original artwork inside APK')
          PY
      - name: Verify APKs and produce SHA-256 checksums
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          test -s "$OUT/app-arm64-v8a-debug.apk"
          unzip -tq "$OUT/app-arm64-v8a-debug.apk" >/dev/null
          # Check Android package signature and ZIP alignment before publishing.
          # A valid ZIP alone is not sufficient for installation on Samsung S23.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -1)
          test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose "$OUT/app-arm64-v8a-debug.apk"
          "$ZIPALIGN" -c -v 4 "$OUT/app-arm64-v8a-debug.apk"
          # Read the complete archive listing before searching: grep -q in a pipe
          # can close early and trigger SIGPIPE with shell pipefail enabled.
          unzip -Z1 "$OUT/app-arm64-v8a-debug.apk" > /tmp/s23-apk-entries.txt
          grep -Fxq 'lib/arm64-v8a/libflutter.so' /tmp/s23-apk-entries.txt
          grep -Fxq 'classes.dex' /tmp/s23-apk-entries.txt
          # Debug Flutter apps must bundle their Dart entrypoint and ARM64 engine.
          grep -Fxq 'assets/flutter_assets/kernel_blob.bin' /tmp/s23-apk-entries.txt
          if grep -Eq '^lib/(x86|x86_64|armeabi-v7a)/' /tmp/s23-apk-entries.txt; then
            echo 'Unexpected non-ARM64 native libraries in Samsung S23 APK' >&2
            exit 1
          fi
          cd "$OUT"
          sha256sum app-arm64-v8a-debug.apk > app-arm64-v8a-debug.apk.sha256
          sha256sum --check --strict app-arm64-v8a-debug.apk.sha256
          echo "Verified SHA-256 checksum for commit $GITHUB_SHA"
          ls -lh app-arm64-v8a-debug.apk
          echo 'Samsung S23 arm64-v8a APK verified'
      - name: Record APK build provenance for Samsung S23
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          assert apk.is_file() and apk.stat().st_size > 0, 'Missing ARM64 APK'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          icon = Path('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')
          round_icon = Path('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png')
          assert icon.is_file() and round_icon.is_file(), 'Missing Samsung branded launcher icons'
          assert icon.read_bytes() == round_icon.read_bytes(), 'Samsung round icon differs from original launcher'
          icon_sha256 = hashlib.sha256(icon.read_bytes()).hexdigest()
          report = {
              'launcher_icon_sha256': icon_sha256,
              'launcher_icon_verified': True,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'apk': apk.name,
              'architecture': 'arm64-v8a',
              'build_type': 'debug',
              'bytes': apk.stat().st_size,
              'sha256': digest,
              'device_target': 'Samsung Galaxy S23',
              'physical_install_tested': False,
          }
          output = apk.with_suffix('.build-info.json')
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(f'Build provenance recorded for commit {report["commit"][:12]}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-studio-s23-arm64-debug-apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk.sha256
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.build-info.json
