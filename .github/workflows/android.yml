name: Android APK
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name "$(grep '^name:' pubspec.yaml | awk '{print $2}')" .
      - name: Install native video audio extraction bridge
        run: |
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/subtitle_studio_ai/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY
      - name: Use official Gradle distribution CDN
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = p.read_text().replace('services.gradle.org/distributions/', 'downloads.gradle.org/distributions/')
          p.write_text(text)
          PYCODE
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install Android API 36 and set compileSdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(s)
          PY
      - name: Set application label and preserve existing Android identity
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:label="[^"]*"', 'android:label="Subtitle Studio AI"', text, count=1)
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts').read_text()
          assert 'applicationId = "com.example.subtitle_studio_ai"' in gradle, 'Android identity changed unexpectedly'
          PYCODE
      - name: Check Android package identity for update compatibility
        run: |
          grep -n 'applicationId' android/app/build.gradle.kts
          echo '::notice::Existing install updates require matching package ID and signing certificate.'
      - name: Generate original launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
      - name: Prevent default Flutter adaptive icon overriding branded icon
        run: |
          # Flutter's generated adaptive launcher can take precedence on Android 8+.
          # Use our custom mipmap PNGs consistently, including Samsung One UI.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Verify custom launcher icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              path = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              assert path.is_file(), f'Missing {path}'
              with Image.open(path) as icon:
                  assert icon.size == (size, size), f'Invalid icon size: {path}'
          print('All five branded Android launcher icons verified')
          PY
      - name: Reject generic Android launcher and verify branded artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path('android/app/src/main/res')
          for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
              p = base / f'mipmap-{density}' / 'ic_launcher.png'
              with Image.open(p) as image:
                  rgb = image.convert('RGB')
                  pixels = list(rgb.getdata())
                  assert len(set(pixels)) > 12, f'Generic/blank icon: {p}'
                  gold = sum(1 for r,g,b in pixels if r > 130 and g > 90 and b < 185)
                  assert gold > len(pixels) // 100, f'Branded gold artwork absent: {p}'
          assert not (base / 'mipmap-anydpi-v26/ic_launcher.xml').exists(), 'Default adaptive icon overrides artwork'
          print('Verified branded icon artwork in all five launcher densities')
          PY
      - name: Test authenticated AI proxy
        run: node --test backend/test/worker.test.mjs
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Samsung S23 arm64 APK
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Verify APK launcher pixels, ARM64 runtime and bundled illustrations
        run: python3 scripts/verify_apk_resources.py
      - name: Verify compiled launcher resources
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          # Verify the launcher resource itself, not just unrelated PNG assets.
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump resources "$APK" > /tmp/compiled-apk-resources.txt
          grep -q 'mipmap/ic_launcher' /tmp/compiled-apk-resources.txt
          "$AAPT" dump badging "$APK" > /tmp/compiled-apk-badging.txt
          grep -q "^application-icon-" /tmp/compiled-apk-badging.txt
          grep -q "^package: name=" /tmp/compiled-apk-badging.txt
          echo "Compiled APK launcher resource and package metadata verified"
      - name: Verify Samsung S23 APK signing and Android compatibility
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > /tmp/s23-badging.txt
          grep -q "^package: name=" /tmp/s23-badging.txt
          grep -Fq "package: name='com.example.subtitle_studio_ai'" /tmp/s23-badging.txt
          grep -Fq "native-code: 'arm64-v8a'" /tmp/s23-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/s23-badging.txt').read_text()
          match = re.search(r"sdkVersion:'(\d+)'", text)
          assert match, 'Missing minSdkVersion in APK'
          minimum = int(match.group(1))
          assert minimum <= 34, f'APK requires Android API {minimum}, higher than Galaxy S23 Android 14'
          print(f'APK signed and minSdk={minimum}; compatible with Android 14 API 34')
          PY
      - name: Verify APKs and produce SHA-256 checksums
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          test -s "$OUT/app-arm64-v8a-debug.apk"
          unzip -tq "$OUT/app-arm64-v8a-debug.apk" >/dev/null
          unzip -l "$OUT/app-arm64-v8a-debug.apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          unzip -Z1 "$OUT/app-arm64-v8a-debug.apk" | grep -Fq 'classes.dex'
          cd "$OUT"
          sha256sum app-arm64-v8a-debug.apk > app-arm64-v8a-debug.apk.sha256
          ls -lh app-arm64-v8a-debug.apk
          echo 'Samsung S23 arm64-v8a APK verified'
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-s23-arm64-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk.sha256
